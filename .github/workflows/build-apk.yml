name: Build APK - NURA LD36 Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit smoke test
        run: |
          mkdir -p /tmp/nura-test
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/ProtocolInspector.java tests/ProtocolInspectorSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.ProtocolInspectorSmokeTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NURA-LD36-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
