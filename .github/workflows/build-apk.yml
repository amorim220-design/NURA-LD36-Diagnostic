name: Build APK - NURA LD36 Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main, feature/diagnostico-passivo-completo, feature/espelhamento-h264-v04, feature/ajuste-tela-v05, feature/rotacao-dinamica-v06, feature/rotacao-rebind-v07, feature/uv-orientation-v08]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit smoke test
        run: |
          mkdir -p /tmp/nura-test
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/ProtocolInspector.java tests/ProtocolInspectorSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.ProtocolInspectorSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/StreamProbe.java tests/StreamProbeSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.StreamProbeSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/ActiveProtocolSession.java tests/ActiveProtocolSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.ActiveProtocolSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/VideoPacket.java tests/VideoPacketSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.VideoPacketSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectCrop.java tests/AspectCropSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.AspectCropSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectFit.java tests/AspectFitSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.AspectFitSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectFit.java app/src/main/java/com/nura/ld36diagnostic/RotationGeometry.java tests/RotationGeometrySmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.RotationGeometrySmokeTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NURA-LD36-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
