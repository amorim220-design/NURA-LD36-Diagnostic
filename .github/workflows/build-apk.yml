name: Build APK - NURA LD36 Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main, feature/diagnostico-passivo-completo, feature/espelhamento-h264-v04, feature/ajuste-tela-v05, feature/rotacao-dinamica-v06, feature/rotacao-rebind-v07, feature/uv-orientation-v08, feature/geometry-reset-v09, feature/native-tv-compositor-v10, feature/original-auto-rotation-v11, feature/encoder-timeout-safety-v12, feature/vdat-angle-original-v13, feature/vdat-angle-diagnostics-v14, feature/vdat-angle-inverted-v15, feature/landscape-start-isolated-v16, feature/native-orientation-start-v17, feature/manual-vdat-angle-fps-v18, feature/native-aspect-encoder-v19, feature/safe-orientation-handoff-v20, feature/native-portrait-aspect-v21, feature/dual-native-safe-handoff-v22, feature/live-native-rotation-v23, feature/fixed-encoder-rotation-v24, feature/fast-gpu-resize-v26, feature/portrait-gpu-rotation-v27, feature/hybrid-v22-v27-safe-v32, feature/v35-hybrid-auto-consent-handoff, feature/v36-safe-handoff-guard, feature/v37-bidirectional-handoff, feature/v38-live-projection, feature/v39-fixed-gpu, feature/v40-orientation-inversion, feature/v41-native-start, feature/v42-portrait-canvas, feature/v43-landscape-flip, feature/v44-stability]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit smoke test
        run: |
          mkdir -p /tmp/nura-test
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/ProtocolInspector.java tests/ProtocolInspectorSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.ProtocolInspectorSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/StreamProbe.java tests/StreamProbeSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.StreamProbeSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/ActiveProtocolSession.java tests/ActiveProtocolSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.ActiveProtocolSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/VideoPacket.java tests/VideoPacketSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.VideoPacketSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectCrop.java tests/AspectCropSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.AspectCropSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectFit.java tests/AspectFitSmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.AspectFitSmokeTest
          javac -encoding UTF-8 -d /tmp/nura-test app/src/main/java/com/nura/ld36diagnostic/AspectFit.java app/src/main/java/com/nura/ld36diagnostic/RotationGeometry.java tests/RotationGeometrySmokeTest.java
          java -cp /tmp/nura-test com.nura.ld36diagnostic.RotationGeometrySmokeTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NURA-LD36-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned experimental APK
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          TAG="v${VERSION}-experimental"
          APK="NURA-LD36-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "NURA LD36 v${VERSION} experimental" --notes "Debug APK; physical LD36 validation pending." --prerelease
          fi
